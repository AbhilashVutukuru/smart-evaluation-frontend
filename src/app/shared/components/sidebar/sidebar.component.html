<div class="sidebar" [class.collapsed]="isCollapsed">

  <!-- Toggle Button -->
  <button class="toggle-btn" (click)="toggleCollapse()" [title]="isCollapsed ? 'Expand' : 'Collapse'">
    <i [class]="isCollapsed ? 'fas fa-chevron-right' : 'fas fa-chevron-left'"></i>
  </button>

  <!-- Sidebar Header -->
  <div class="sidebar-header">
    <div class="logo">
      <i class="fas fa-th-large"></i>
    </div>
    <ng-container *ngIf="!isCollapsed">
      <h3>School Portal</h3>
      <p *ngIf="schoolName">{{ schoolName }}</p>
      <p *ngIf="!schoolName">Dashboard</p>

      <!-- Academic Year Display -->
      <div class="academic-year" *ngIf="currentAcademicYear">
        <i class="fas fa-calendar-alt"></i>
        <span>{{ currentAcademicYear }}</span>
      </div>

      <!-- Loading state for academic year -->
      <div class="academic-year loading" *ngIf="isLoadingAcademicYear">
        <i class="fas fa-spinner fa-spin"></i>
        <span>Loading...</span>
      </div>
    </ng-container>
  </div>

  <!-- User Info -->
  <div class="user-info-minimal" *ngIf="userName">
    <i class="fas fa-user" [title]="isCollapsed ? (userName || '') : ''"></i>
    <ng-container *ngIf="!isCollapsed">
      <div class="user-info-text">
        <span class="user-name-simple" [title]="userName || ''">{{ userName }}</span>
      </div>
    </ng-container>
    <span class="user-role-badge" *ngIf="userRole && !isCollapsed">{{ userRole }}</span>
  </div>

  <!-- Menu Items -->
  <nav class="sidebar-nav">
    <a
      *ngFor="let item of visibleMenuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="nav-item"
      [title]="item.label"
    >
      <i [class]="item.icon"></i>
      <span *ngIf="!isCollapsed">{{ item.label }}</span>
    </a>

    <div *ngIf="visibleMenuItems.length === 0 && !isCollapsed" class="no-menu-items">
      <i class="fas fa-info-circle"></i>
      <p>No menu items available</p>
    </div>
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <button (click)="logout()" class="logout-btn" [title]="isCollapsed ? 'Logout' : ''">
      <i class="fas fa-sign-out-alt"></i>
      <span *ngIf="!isCollapsed">Logout</span>
    </button>
  </div>
</div>
