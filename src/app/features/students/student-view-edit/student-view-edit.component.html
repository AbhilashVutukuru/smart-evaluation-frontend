<div class="view-edit-container">
  <div class="page-header">
    <div class="header-left">
      <button class="btn btn-secondary" (click)="goBack()">
        <i class="fas fa-arrow-left"></i> Back
      </button>
      <h2>
        <i class="fas fa-user-graduate"></i> 
        {{ mode === 'view' ? 'Student Details' : 'Edit Student' }}
      </h2>
    </div>
    <div class="header-actions" *ngIf="mode === 'view'">
      <button class="btn btn-primary" (click)="enableEdit()">
        <i class="fas fa-edit"></i> Edit
      </button>
      <button class="btn btn-danger" (click)="deleteStudent()">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  </div>

  <div *ngIf="success" class="alert alert-success">
    <i class="fas fa-check-circle"></i>
    <span>{{ success }}</span>
    <button class="alert-close" (click)="success = ''">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div *ngIf="error" class="alert alert-error">
    <i class="fas fa-exclamation-circle"></i>
    <span>{{ error }}</span>
    <button class="alert-close" (click)="error = ''">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="card">
    <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
      <div class="section-header">
        <i class="fas fa-id-card"></i>
        <span>Personal Information</span>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">First Name <span class="required">*</span></label>
          <input type="text" class="form-control" formControlName="firstName" placeholder="Enter first name">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Last Name <span class="required">*</span></label>
          <input type="text" class="form-control" formControlName="lastName" placeholder="Enter last name">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Date of Birth <span class="required">*</span></label>
          <input type="date" class="form-control" formControlName="dateOfBirth">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Gender <span class="required">*</span></label>
          <select class="form-control" formControlName="gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="section-header">
        <i class="fas fa-address-book"></i>
        <span>Contact Information</span>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Email <span class="required">*</span></label>
          <input type="email" class="form-control" formControlName="email" placeholder="student@example.com">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Phone Number <span class="required">*</span></label>
          <input type="text" class="form-control" formControlName="phoneNumber" placeholder="+91 1234567890">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Address <span class="required">*</span></label>
        <textarea class="form-control" formControlName="address" rows="2" placeholder="Enter complete address"></textarea>
      </div>

      <div class="section-header">
        <i class="fas fa-graduation-cap"></i>
        <span>Academic Information</span>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Class <span class="required">*</span></label>
          <select class="form-control" formControlName="classId" (change)="onClassChange($event)">
            <option value="">Select Class</option>
            <option *ngFor="let cls of classes" [value]="cls.id">{{ cls.className }}</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Section <span class="required">*</span></label>
          <select class="form-control" formControlName="sectionId">
            <option value="">Select Section</option>
            <option *ngFor="let sec of sections" [value]="sec.id">{{ sec.sectionName }}</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Roll Number <span class="required">*</span></label>
          <input type="text" class="form-control" formControlName="rollNumber" placeholder="e.g., 101">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Admission Date <span class="required">*</span></label>
        <input type="date" class="form-control" formControlName="admissionDate">
      </div>

      <div class="button-group" *ngIf="mode === 'edit'">
        <button type="submit" class="btn btn-success btn-lg" [disabled]="loading || studentForm.invalid">
          <i [class]="loading ? 'fas fa-spinner fa-spin' : 'fas fa-save'"></i>
          {{ loading ? 'Saving...' : 'Save Changes' }}
        </button>
        <button type="button" class="btn btn-secondary btn-lg" (click)="cancelEdit()">
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<app-delete-confirmation
  [show]="showDeleteModal"
  [title]="'Delete Student'"
  [message]="'Are you sure you want to delete this student?'"
  [itemName]="getStudentInfo()"
  (confirmed)="onDeleteConfirmed()"
  (cancelled)="onDeleteCancelled()">
</app-delete-confirmation>

<app-cancel-confirmation
  [show]="showCancelModal"
  [title]="'Unsaved Changes'"
  [message]="'You have unsaved changes. Are you sure you want to discard them?'"
  (confirmed)="onCancelConfirmed()"
  (cancelled)="onCancelCancelled()">
</app-cancel-confirmation>
