<!-- unauthorized.component.html -->
<div class="unauthorized-container">
  <div class="unauthorized-card">
    <!-- Icon -->
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" class="unauthorized-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>

    <!-- Title -->
    <h1 class="title">Access Denied</h1>

    <!-- Error Code -->
    <div class="error-code">Error 403</div>

    <!-- Message -->
    <p class="message">
      You don't have permission to access this page.
    </p>

    <!-- User Info -->
    <div class="user-info" *ngIf="userEmail">
      <p class="user-detail">
        <strong>Logged in as:</strong> {{ userEmail }}
      </p>
      <p class="user-detail" *ngIf="userRole">
        <strong>Role:</strong> {{ userRole }}
      </p>
    </div>

    <!-- Description -->
    <p class="description">
      This page requires specific permissions that your account doesn't have. 
      If you believe this is an error, please contact your administrator.
    </p>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Go to Dashboard
      </button>
      
      <button class="btn btn-secondary" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Logout
      </button>
    </div>

    <!-- Help Link -->
    <div class="help-section">
      <p class="help-text">
        Need help? 
        <a routerLink="/help" class="help-link">Contact Support</a>
      </p>
    </div>
  </div>
</div>
