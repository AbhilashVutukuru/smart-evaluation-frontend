<div class="change-password-container" [class.first-time]="isFirstTimeChange">
  <div class="change-password-card">

    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-icon">
        <i class="fas fa-lock"></i>
      </div>
      <h2>Change Password</h2>
      <p>Keep your account secure</p>
    </div>

    <!-- Success Alert -->
    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      {{ success }}
      <button class="btn-close" (click)="success = ''">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Error Alert -->
    <div *ngIf="error" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i>
      {{ error }}
      <button class="btn-close" (click)="error = ''">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">

      <!-- Current Password -->
      <div class="mb-3">
        <label class="form-label">Current Password <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input
            [type]="showOldPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="oldPassword"
            placeholder="Enter current password"
            [class.is-invalid]="f['oldPassword'].invalid && f['oldPassword'].touched"
          >
          <span class="toggle-password" (click)="togglePassword('old')">
            <i [class]="showOldPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
        <div *ngIf="f['oldPassword'].invalid && f['oldPassword'].touched" class="text-danger">
          <i class="fas fa-exclamation-circle"></i> Current password is required
        </div>
      </div>

      <!-- New Password -->
      <div class="mb-3">
        <label class="form-label">New Password <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-key"></i></span>
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="newPassword"
            placeholder="Enter new password"
            [class.is-invalid]="f['newPassword'].invalid && f['newPassword'].touched"
          >
          <span class="toggle-password" (click)="togglePassword('new')">
            <i [class]="showNewPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
      </div>

      <!-- Password Requirements -->
      <div class="password-requirements">
        <div class="requirement" [class.met]="passwordRequirements.length">
          <i [class]="passwordRequirements.length ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          8+ characters
        </div>
        <div class="requirement" [class.met]="passwordRequirements.uppercase">
          <i [class]="passwordRequirements.uppercase ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          Uppercase (A–Z)
        </div>
        <div class="requirement" [class.met]="passwordRequirements.lowercase">
          <i [class]="passwordRequirements.lowercase ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          Lowercase (a–z)
        </div>
        <div class="requirement" [class.met]="passwordRequirements.number">
          <i [class]="passwordRequirements.number ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          Number (0–9)
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label class="form-label">Confirm New Password <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-check-double"></i></span>
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-control"
            formControlName="confirmPassword"
            placeholder="Re-enter new password"
            [class.is-invalid]="(f['confirmPassword'].invalid && f['confirmPassword'].touched) || (changePasswordForm.errors?.['passwordMismatch'] && f['confirmPassword'].touched)"
          >
          <span class="toggle-password" (click)="togglePassword('confirm')">
            <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
        <div *ngIf="changePasswordForm.errors?.['passwordMismatch'] && f['confirmPassword'].touched" class="text-danger">
          <i class="fas fa-exclamation-circle"></i> Passwords do not match
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" [disabled]="loading || changePasswordForm.invalid">
        <i [class]="loading ? 'fas fa-spinner fa-spin' : 'fas fa-check'"></i>
        {{ loading ? 'Changing Password...' : 'Change Password' }}
      </button>

      <!-- Reset Form -->
      <button type="button" class="btn-reset" (click)="changePasswordForm.reset()">
        <i class="fas fa-redo"></i>
        Reset Form
      </button>

    </form>

    <!-- Back to Login — only shown on first-time change -->
    <div class="back-to-login" *ngIf="isFirstTimeChange">
      <a (click)="goToLogin()">
        <i class="fas fa-arrow-left"></i>
        Back to Login
      </a>
    </div>

  </div>
</div>
