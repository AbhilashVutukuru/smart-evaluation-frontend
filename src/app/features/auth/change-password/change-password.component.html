<div class="change-password-container">
  <div class="change-password-card">
    <div class="header-section">
      <div class="icon">
        <i class="fas fa-key"></i>
      </div>
      <h2>Change Password</h2>
      <p>Update your password to keep your account secure</p>
    </div>

    <div *ngIf="success" class="alert alert-success">
      <i class="fas fa-check-circle"></i> {{ success }}
    </div>

    <div *ngIf="error" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Current Password *</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fas fa-lock"></i>
          </span>
          <input 
            [type]="showOldPassword ? 'text' : 'password'"
            class="form-control" 
            formControlName="oldPassword"
            placeholder="Enter current password"
            [class.is-invalid]="f['oldPassword'].invalid && f['oldPassword'].touched"
          >
          <span class="input-group-text toggle-password" (click)="togglePassword('old')">
            <i [class]="showOldPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
        <div *ngIf="f['oldPassword'].invalid && f['oldPassword'].touched" class="text-danger small mt-1">
          Current password is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">New Password *</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fas fa-lock"></i>
          </span>
          <input 
            [type]="showNewPassword ? 'text' : 'password'"
            class="form-control" 
            formControlName="newPassword"
            placeholder="Enter new password"
            [class.is-invalid]="f['newPassword'].invalid && f['newPassword'].touched"
          >
          <span class="input-group-text toggle-password" (click)="togglePassword('new')">
            <i [class]="showNewPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
      </div>

      <div class="password-requirements mb-3">
        <small class="text-muted">Password must contain:</small>
        <div class="requirement" [class.met]="passwordRequirements.length">
          <i [class]="passwordRequirements.length ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          At least 8 characters
        </div>
        <div class="requirement" [class.met]="passwordRequirements.uppercase">
          <i [class]="passwordRequirements.uppercase ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          One uppercase letter
        </div>
        <div class="requirement" [class.met]="passwordRequirements.lowercase">
          <i [class]="passwordRequirements.lowercase ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          One lowercase letter
        </div>
        <div class="requirement" [class.met]="passwordRequirements.number">
          <i [class]="passwordRequirements.number ? 'fas fa-check-circle' : 'far fa-circle'"></i>
          One number
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm New Password *</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="fas fa-lock"></i>
          </span>
          <input 
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-control" 
            formControlName="confirmPassword"
            placeholder="Confirm new password"
            [class.is-invalid]="(f['confirmPassword'].invalid && f['confirmPassword'].touched) || (changePasswordForm.errors?.['passwordMismatch'] && f['confirmPassword'].touched)"
          >
          <span class="input-group-text toggle-password" (click)="togglePassword('confirm')">
            <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>
        <div *ngIf="changePasswordForm.errors?.['passwordMismatch'] && f['confirmPassword'].touched" class="text-danger small mt-1">
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn btn-submit" [disabled]="loading || changePasswordForm.invalid">
        <i [class]="loading ? 'fas fa-spinner fa-spin me-2' : 'fas fa-check me-2'"></i>
        {{ loading ? 'Changing...' : 'Change Password' }}
      </button>

      <button type="button" class="btn btn-cancel mt-2" (click)="changePasswordForm.reset()">
        <i class="fas fa-times me-2"></i>
        Cancel
      </button>
    </form>
  </div>
</div>
